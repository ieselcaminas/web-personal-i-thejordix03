security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
            logout:
                path: logout

    access_control:
        - { path: ^/autor/new, roles: ROLE_USER }
        - { path: ^/autor/\d+/edit, roles: ROLE_USER }
        - { path: ^/autor/\d+/delete, roles: ROLE_USER }
        - { path: ^/manga/new, roles: ROLE_USER }
        - { path: ^/manga/\d+/edit, roles: ROLE_USER }
        - { path: ^/manga/\d+/delete, roles: ROLE_USER }
